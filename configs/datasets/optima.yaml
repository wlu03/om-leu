# Optima: Swiss CarPostal revealed-preference mode-choice survey (Bierlaire,
# CS_OptimaDescription 2018). One event per home-based trip loop; the
# stated main mode among public transport / private motorised / soft modes
# is the choice. Prepared by scripts/prepare_optima.py into the generic
# mode-choice layout (src/data/modechoice_slates.py).
#
# Most respondents have a single loop, so use ``--split-mode cold_start``
# and ``--min-events-per-customer 1``; val/test respondents are unseen in
# training and z_d carries the (rich) demographics.

dataset:
  name: optima
  description: >
    Optima RP mode choice, Switzerland 2009-2010. 1,906 loops from 1,763
    respondents; alternatives pt | car | soft (all treated as available).

  events:
    path: optima/data/events.csv
    parse_dates:
      - pseudo_date
    column_map:
      respondent_id:   customer_id
      pseudo_date:     order_date
      alt_id:          asin
      purpose_label:   category
      cost_chf:        price
      alt_label:       title
    dropna_subset:
      - customer_id
      - order_date
      - asin
    category_null_fill: "Unknown"
    dtype_coerce:
      price: float
      customer_id: str
      asin: str

  persons:
    path: optima/data/persons.csv
    id_column: respondent_id

    z_d_mapping:
      age_bucket:
        source: age_bucket
        kind: categorical_map
        values:
          "18-24": "18-24"
          "25-34": "25-34"
          "35-44": "35-44"
          "45-54": "45-54"
          "55-64": "55-64"
          "65+":   "65+"
      # Monthly household income classes mapped to annual canonical buckets.
      income_bucket:
        source: income_bucket
        kind: categorical_map
        values:
          "25-50k":   "25-50k"
          "50-100k":  "50-100k"
          "100-150k": "100-150k"
          "150k+":    "150k+"
      city_size:
        source: city_size
        kind: categorical_map
        values:
          "rural":  "rural"
          "small":  "small"
          "medium": "medium"
      household_size:
        source: household_bucket
        kind: categorical_to_int
        values:
          "solo": 1
          "pair": 2
          "three": 3
          "four": 4
          "five_plus": 5
      has_kids:
        source: has_kids
        kind: passthrough
      education:
        source: education
        kind: passthrough
      health_rating:
        source: null
        kind: constant
        value: 3
      risk_tolerance:
        source: null
        kind: constant
        value: 0
      purchase_frequency:
        source: derived_from_events
        aggregator: count
        group_by: customer_id
      novelty_rate:
        source: derived_from_events
        aggregator: mean
        aggregator_column: novelty
        group_by: customer_id

    c_d_extra_fields:
      gender:
        source: gender_label
        kind: passthrough
      profile_lines:
        source: profile_lines
        kind: passthrough
      domain_verb:
        kind: constant
        value: "Makes trip loops from home"
      activity_noun:
        kind: constant
        value: "loops"
      novelty_object:
        kind: constant
        value: "mode choices"
      self_report_verb:
        kind: constant
        value: "Travels"
      currency:
        kind: constant
        value: "CHF"
      recent_label:
        kind: constant
        value: "Modes chosen on recent loops"
      top_brand_label:
        kind: constant
        value: "Mode chosen most often so far"
      top_categories_label:
        kind: constant
        value: "Most common loop purposes"
      avg_price_label:
        kind: constant
        value: "Typical cost of the option they pick"
      repeat_rate_label:
        kind: constant
        value: "of their choices repeat a mode they had already picked"

  training:
    choice_set_size: 3         # J: pt | car | soft
    n_resamples: 1
    val_frac: 0.15             # cold-start: share of RESPONDENTS held out
    test_frac: 0.15
    subsample:
      enabled: false
      n_customers: 100
      seed: 42

# Overrides for configs/default.yaml ``data:`` keys. With (mostly) one loop
# per respondent, the train-history aggregate lines ("Mode chosen most often
# so far", repeat rate, typical cost) would restate the label for train
# respondents and be absent for held-out ones. Off.
data:
  enrich_customer_context: false

# Generic mode-choice adapter block (src/data/modechoice_slates.py).
modechoice:
  impressions_path: optima/data/impressions.csv
  properties_path: optima/data/properties.csv
  slate_column: slate_alt_ids
  event_id_column: event_id
  currency: CHF
  phrase_column: trip_phrase
